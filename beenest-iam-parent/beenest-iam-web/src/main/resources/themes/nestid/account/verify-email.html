<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.verifyEmail.docTitle}">邮箱验证 · 蜂巢身份</title>
    <link rel="stylesheet" th:href="@{/theme-static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/theme-static/css/iam.css}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12.5 7.2v14.6L16 30 3.5 23.8V9.2z' fill='%23f5b32d'/%3E%3Cpath d='M16 8l6.8 3.9v7.8L16 23.6 9.2 19.7v-7.8z' fill='%230e1626'/%3E%3C/svg%3E">
</head>
<body>
<div class="iam-shell">
    <aside class="iam-aside">
        <div class="iam-aside-content">
            <div class="iam-logo">
                <svg class="iam-logo-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M16 1.6l12.3 7.1v14.6L16 30.4 3.7 23.3V8.7z" fill="#f5b32d"/>
                    <path d="M16 7.4l7 4v8.2l-7 4-7-4v-8.2z" fill="#0e1626"/>
                    <circle cx="16" cy="16" r="2.6" fill="#f5b32d"/>
                </svg>
                <div class="iam-logo-text">
                    <p class="iam-logo-name" th:text="#{page.brand.name}">蜂巢身份</p>
                    <p class="iam-logo-sub">Beenest IAM</p>
                </div>
            </div>
            <div class="iam-aside-hero">
                <h1><span th:text="#{page.verifyEmail.hero.line1}">邮箱验证</span><br><em th:text="#{page.verifyEmail.hero.line2}">账户更安全</em></h1>
                <p th:text="#{page.verifyEmail.hero.desc}">已验证的邮箱是找回口令与接收安全通知的主要通道。</p>
            </div>
            <div class="iam-aside-footer" th:text="|© 2026 Beenest IAM · #{page.brand.footer}|">© 2026 Beenest IAM · 统一身份认证中心</div>
        </div>
    </aside>

    <main class="iam-main">
        <div class="iam-form-wrap">
            <header class="iam-form-head">
                <h2 th:text="${success} ? ${#messages.msg('page.verifyEmail.successHeading')} : ${#messages.msg('page.verifyEmail.failHeading')}">邮箱验证</h2>
                <p th:text="${success} ? ${#messages.msg('page.verifyEmail.successSubtitle')} : ${#messages.msg('page.verifyEmail.failSubtitle')}">验证结果</p>
            </header>

            <div class="iam-alert iam-alert-info" th:if="${success}" role="status">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>
                </svg>
                <span th:text="${!#strings.isEmpty(message)} ? ${message} : ${#messages.msg('page.verifyEmail.successMessage')}">邮箱已验证完成</span>
            </div>

            <div class="iam-alert" th:unless="${success}" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
                </svg>
                <span th:text="${!#strings.isEmpty(message)} ? ${message} : ${#messages.msg('page.verifyEmail.failMessage')}">验证链接无效或已过期</span>
            </div>

            <p class="iam-form-foot">
                <a th:href="@{/login(realm=${realmKey})}" th:text="#{page.verifyEmail.toLogin}">前往登录</a>
            </p>

            <div class="iam-lang-row">
                <a th:replace="~{(${themeName} + '/fragments/lang-switch') :: switch}"></a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
