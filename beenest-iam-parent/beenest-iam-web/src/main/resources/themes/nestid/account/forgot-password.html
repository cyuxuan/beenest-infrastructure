<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.forgot.docTitle}">找回口令 · 蜂巢身份</title>
    <link rel="stylesheet" th:href="@{/theme-static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/theme-static/css/iam.css}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12.5 7.2v14.6L16 30 3.5 23.8V9.2z' fill='%23f5b32d'/%3E%3Cpath d='M16 8l6.8 3.9v7.8L16 23.6 9.2 19.7v-7.8z' fill='%230e1626'/%3E%3C/svg%3E">
</head>
<body>
<div class="iam-shell">
    <aside class="iam-aside">
        <div class="iam-aside-content">
            <div class="iam-logo">
                <svg class="iam-logo-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M16 1.6l12.3 7.1v14.6L16 30.4 3.7 23.3V8.7z" fill="#f5b32d"/>
                    <path d="M16 7.4l7 4v8.2l-7 4-7-4v-8.2z" fill="#0e1626"/>
                    <circle cx="16" cy="16" r="2.6" fill="#f5b32d"/>
                </svg>
                <div class="iam-logo-text">
                    <p class="iam-logo-name" th:text="#{page.brand.name}">蜂巢身份</p>
                    <p class="iam-logo-sub">Beenest IAM</p>
                </div>
            </div>
            <div class="iam-aside-hero">
                <h1><span th:text="#{page.forgot.hero.line1}">忘记口令</span><br><em th:text="#{page.forgot.hero.line2}">不必着急</em></h1>
                <p th:text="#{page.forgot.hero.desc}">通过已绑定的邮箱或手机号验证身份,即可重新设置登录口令。整个过程不需要联系管理员。</p>
            </div>
            <div class="iam-aside-footer" th:text="|© 2026 Beenest IAM · #{page.brand.footer}|">© 2026 Beenest IAM · 统一身份认证中心</div>
        </div>
    </aside>

    <main class="iam-main">
        <div class="iam-form-wrap">
            <header class="iam-form-head">
                <h2 th:text="#{page.forgot.heading}">找回口令</h2>
                <p><span th:text="#{page.forgot.subtitle}">请输入账号绑定的邮箱或手机号</span><span class="iam-realm-tag" th:text="${realmKey}">default</span></p>
            </header>

            <div class="iam-alert iam-alert-info" id="info-box" role="status" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>
                </svg>
                <span id="info-text"></span>
            </div>

            <!-- 邮件通道未启用:只能走手机号,提前说清楚而不是等用户填完邮箱才发现收不到 -->
            <div class="iam-alert iam-alert-info" th:unless="${mailAvailable}" role="status">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>
                </svg>
                <span th:text="#{page.forgot.mailUnavailable}">当前仅支持手机号找回:请输入账号绑定的手机号,通过短信验证码重置口令。</span>
            </div>

            <div class="iam-alert" id="error-box" role="alert" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
                </svg>
                <span id="error-text"></span>
            </div>

            <form class="iam-form" id="reset-request-form" autocomplete="on">
                <input type="hidden" name="realm" th:value="${realmKey}">
                <div>
                    <label class="iam-field-label" for="account" th:text="#{page.forgot.label.account}">邮箱或手机号</label>
                    <div class="iam-input-group">
                        <span class="iam-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
                            </svg>
                        </span>
                        <input class="iam-input" type="text" id="account" name="account"
                               th:placeholder="#{page.forgot.placeholder.account}" placeholder="name@example.com 或 13800000000" required autofocus>
                    </div>
                </div>

                <button class="iam-btn-primary" type="submit" id="submit-btn"
                        th:text="#{page.forgot.submit}">发送重置链接</button>
            </form>

            <p class="iam-form-foot">
                <a th:href="@{/login(realm=${realmKey})}" th:text="#{page.common.backToLogin}">返回登录</a>
            </p>

            <div class="iam-lang-row">
                <a th:replace="~{(${themeName} + '/fragments/lang-switch') :: switch}"></a>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    (function () {
        var form = document.getElementById('reset-request-form');
        var submitBtn = document.getElementById('submit-btn');
        var infoBox = document.getElementById('info-box');
        var errorBox = document.getElementById('error-box');
        var realmKey = /*[[${realmKey}]]*/ 'default';

        /* 脚本文案由服务端按请求语言注入 */
        var MSG = {
            accountRequired: /*[[#{page.forgot.js.accountRequired}]]*/ '请输入邮箱或手机号',
            sent: /*[[#{page.forgot.js.sent}]]*/ '如果该账号存在且已绑定可用的找回方式,重置信息已发送,请查收。',
            failed: /*[[#{page.forgot.js.failed}]]*/ '操作失败,请稍后重试',
            networkError: /*[[#{page.common.networkError}]]*/ '网络异常,请稍后重试'
        };

        function show(box, text) {
            box.style.display = '';
            box.querySelector('span').textContent = text;
        }

        function hideAll() {
            infoBox.style.display = 'none';
            errorBox.style.display = 'none';
        }

        function csrfHeader() {
            var match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : '';
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            hideAll();
            var account = document.getElementById('account').value.trim();
            if (!account) {
                show(errorBox, MSG.accountRequired);
                return;
            }
            submitBtn.disabled = true;
            fetch('/api/v1/auth/password-reset/request?realm=' + encodeURIComponent(realmKey), {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-XSRF-TOKEN': csrfHeader()},
                credentials: 'same-origin',
                body: JSON.stringify({account: account})
            }).then(function (response) {
                return response.json().catch(function () {
                    return {code: response.status === 200 ? 0 : -1};
                });
            }).then(function (body) {
                submitBtn.disabled = false;
                if (body.code === 0) {
                    // 不区分账号是否存在:统一提示"如果账号存在则已发送"
                    show(infoBox, MSG.sent);
                    form.reset();
                } else {
                    show(errorBox, body.message || MSG.failed);
                }
            }).catch(function () {
                submitBtn.disabled = false;
                show(errorBox, MSG.networkError);
            });
        });
    })();
</script>
</body>
</html>
