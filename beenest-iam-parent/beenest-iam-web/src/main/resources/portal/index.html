<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f1e8">
    <title>应用门户 · 蜂巢身份</title>
    <!-- 退出走表单 POST:令牌与参数名一并内嵌,字段名不能硬编码 -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <link rel="stylesheet" th:href="@{/portal-static/portal.css}">
    <!-- 主题令牌后置:按域覆盖内置默认值,与登录/控制台同一套主题包 -->
    <link rel="stylesheet" th:href="@{/theme-static/css/tokens.css}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12.5 7.2v14.6L16 30 3.5 23.8V9.2z' fill='%23f5b32d'/%3E%3Cpath d='M16 8l6.8 3.9v7.8L16 23.6 9.2 19.7v-7.8z' fill='%230e1626'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="portal is-booting">
    <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark-wrap">
            <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true">
                <defs>
                    <linearGradient id="boot-gold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#ffd777"/>
                        <stop offset="1" stop-color="#e09a12"/>
                    </linearGradient>
                </defs>
                <path d="M16 1.6l12.3 7.1v14.6L16 30.4 3.7 23.3V8.7z" fill="url(#boot-gold)"/>
                <path d="M16 7.4l7 4v8.2l-7 4-7-4v-8.2z" fill="#0e1626"/>
                <circle cx="16" cy="16" r="2.6" fill="url(#boot-gold)"/>
            </svg>
        </div>
        <p class="boot-text">正在载入应用门户</p>
    </div>
</div>
<noscript>
    <div class="noscript">应用门户需要启用 JavaScript。</div>
</noscript>
<script type="module" th:src="@{/portal-static/portal.js}"></script>
</body>
</html>
