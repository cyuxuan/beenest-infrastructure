# ============================================================
# Payment 主配置 — 框架级基础设施（跨环境不变）
# 业务配置（IAM 资源服务 / payment / withdraw）→ application-secret.yml 与 Nacos
# 环境差异化配置 → application-{profile}.yml
# ============================================================

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: beenest-payment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:nacos:beenest-payment.yml?refreshEnabled=true&group=DEFAULT_GROUP
      - optional:nacos:beenest-payment-${spring.profiles.active}.yml?refreshEnabled=true&group=DEFAULT_GROUP
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      # 顶层兜底：NacosConfigProperties.overrideFromEnv() 会读取 spring.cloud.nacos.username/password
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Nacos 开启鉴权时必填：config-import 解析器只从 spring.cloud.nacos.config.* 读取账号密码
        # （URL 上的 username/password 参数会被忽略）。默认用户 nacos/nacos，生产务必改密。
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        fail-fast: false
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        enabled: ${NACOS_ENABLED:true}
        network-interface: ${NETWORK_INTERFACE:}
        # 直接指定注册 IP（优先级最高，解决 IPv6 地址注册问题）
        ip: ${NACOS_DISCOVERY_IP:}
        # 强制使用 IPv4 注册，避免注册 IPv6 地址导致服务间调用失败
        ip-type: IPv4
    inetutils:
      # 优先使用 IPv4 网段（匹配 10.88.x.x 等 WireGuard/内网地址）
      preferred-networks: 10.,172.,192.168.,127.
      # 忽略 macOS 虚拟网卡和 VPN 隧道（wt0 是 WireGuard 业务网卡，不能忽略）
      ignored-interfaces: utun.,awdl.,bridge.,llw.,anpi.,lo0
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
        port: ${SENTINEL_PORT:8720}
      eager: true
    openfeign:
      sentinel:
        enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  cache:
    type: redis
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

# ============================================================
# IAM 资源服务（协议端点见 application-{profile}.yml 的 issuer-uri）
# ============================================================
iam:
  resource-server:
    # 关闭后不注册安全过滤链，仅用于本地排障；生产必须为 true
    enabled: ${IAM_RESOURCE_SERVER_ENABLED:true}
    # 期望的访问令牌受众（aud），对应 IAM 应用门户的「令牌受众」
    # 留空会跳过 aud 校验并打 warn：同域其他应用的令牌也能调用本服务，生产必须配
    audience: ${IAM_AUDIENCE:}
    # 强制 token_kind=APPLICATION，拒绝 PLATFORM（未绑定应用）/ MACHINE（客户端凭证）令牌
    require-application-token: ${IAM_REQUIRE_APPLICATION_TOKEN:false}
    # 首次访问自动开通钱包（替代原 CAS 的"授权即建户"）
    auto-provision-wallet: ${IAM_AUTO_PROVISION_WALLET:true}
    wallet-biz-type: ${IAM_WALLET_BIZ_TYPE:DRONE_ORDER}
    # 钱包非 ACTIVE 时直接 403（替代原 CAS 的"本地用户被禁用即拒绝"）
    reject-inactive-wallet: ${IAM_REJECT_INACTIVE_WALLET:true}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: true

logging:
  level:
    club.beenest.payment: INFO
    club.beenest.payment.mapper: INFO

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
