name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 构建(含迁移脚本校验)
        run: ./mvnw -B -DskipTests package

      - name: 运行测试
        # 集成测试用 Testcontainers 起真实的 PostgreSQL 与 Redis,
        # 不依赖外部服务,CI 上可直接跑
        run: ./mvnw -B verify

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: beenest-iam-server
          path: beenest-iam-server/target/beenest-iam-server-*.jar
          if-no-files-found: error

  image:
    name: 构建运行镜像
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t beenest-iam:ci .

      - name: 镜像自检(容器能启动到健康检查通过)
        run: |
          docker network create iam-ci-net
          docker run -d --name iam-pg --network iam-ci-net \
            -e POSTGRES_DB=beenest_iam -e POSTGRES_USER=beenest -e POSTGRES_PASSWORD=ci-secret \
            postgres:17
          docker run -d --name iam-redis --network iam-ci-net redis:7
          # 等待依赖就绪
          for i in $(seq 1 30); do
            docker exec iam-pg pg_isready -U beenest >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name iam-app --network iam-ci-net -p 8080:8080 -p 9090:9090 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://iam-pg:5432/beenest_iam \
            -e DB_USERNAME=beenest -e DB_PASSWORD=ci-secret \
            -e REDIS_HOST=iam-redis \
            -e IAM_REALM_KEY_SECRET=ci-only-master-secret-please-override \
            -e MANAGEMENT_PORT=9090 \
            beenest-iam:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/actuator/health >/dev/null 2>&1; then
              echo "健康检查通过"
              docker logs iam-app --tail 50
              exit 0
            fi
            sleep 2
          done
          echo "健康检查超时"; docker logs iam-app --tail 100; exit 1
