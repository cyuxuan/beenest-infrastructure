# 蜂巢身份开发环境基础设施:PostgreSQL + Redis
# 仅用于本机开发:端口只绑回环地址,避免同一局域网内的其他机器直接连库/连缓存。
# 生产请使用独立的托管实例,不要复用这里的弱口令与无口令 Redis。
services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=beenest_iam'
      - 'POSTGRES_USER=beenest'
      - 'POSTGRES_PASSWORD=secret123'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beenest -d beenest_iam']
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: 'redis:7'
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
