<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.reset.docTitle}">设置新口令 · 蜂巢身份</title>
    <link rel="stylesheet" th:href="@{/theme-static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/theme-static/css/iam.css}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12.5 7.2v14.6L16 30 3.5 23.8V9.2z' fill='%23f5b32d'/%3E%3Cpath d='M16 8l6.8 3.9v7.8L16 23.6 9.2 19.7v-7.8z' fill='%230e1626'/%3E%3C/svg%3E">
</head>
<body>
<div class="iam-shell">
    <aside class="iam-aside">
        <div class="iam-aside-content">
            <div class="iam-logo">
                <svg class="iam-logo-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M16 1.6l12.3 7.1v14.6L16 30.4 3.7 23.3V8.7z" fill="#f5b32d"/>
                    <path d="M16 7.4l7 4v8.2l-7 4-7-4v-8.2z" fill="#0e1626"/>
                    <circle cx="16" cy="16" r="2.6" fill="#f5b32d"/>
                </svg>
                <div class="iam-logo-text">
                    <p class="iam-logo-name" th:text="#{page.brand.name}">蜂巢身份</p>
                    <p class="iam-logo-sub">Beenest IAM</p>
                </div>
            </div>
            <div class="iam-aside-hero">
                <h1><span th:text="#{page.reset.hero.line1}">设置新口令</span><br><em th:text="#{page.reset.hero.line2}">一次有效</em></h1>
                <p th:text="#{page.reset.hero.desc}">重置链接限时有效且只能使用一次。设置成功后,该账号在其它设备上的登录状态会全部失效。</p>
            </div>
            <div class="iam-aside-footer" th:text="|© 2026 Beenest IAM · #{page.brand.footer}|">© 2026 Beenest IAM · 统一身份认证中心</div>
        </div>
    </aside>

    <main class="iam-main">
        <div class="iam-form-wrap">
            <header class="iam-form-head">
                <h2 th:text="#{page.reset.heading}">设置新口令</h2>
                <p><span th:text="#{page.reset.subtitle}">口令需符合本域的安全策略</span><span class="iam-realm-tag" th:text="${realmKey}">default</span></p>
            </header>

            <div class="iam-alert" th:if="${ticketMissing}" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
                </svg>
                <span th:text="#{page.reset.ticketMissing}">缺少重置票据,请从邮件中的链接重新进入。</span>
            </div>

            <div class="iam-alert" id="error-box" role="alert" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
                </svg>
                <span id="error-text"></span>
            </div>

            <div class="iam-alert iam-alert-info" id="success-box" role="status" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>
                </svg>
                <span id="success-text"></span>
            </div>

            <form class="iam-form" id="reset-form" th:style="${ticketMissing} ? 'display:none' : ''">
                <input type="hidden" id="ticket" th:value="${ticket}">

                <div>
                    <label class="iam-field-label" for="new-password" th:text="#{page.reset.label.newPassword}">新口令</label>
                    <div class="iam-input-group">
                        <span class="iam-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/>
                            </svg>
                        </span>
                        <input class="iam-input" type="password" id="new-password"
                               autocomplete="new-password" th:placeholder="#{page.reset.placeholder.newPassword}" placeholder="至少 8 位" required>
                    </div>
                </div>

                <div>
                    <label class="iam-field-label" for="confirm-password" th:text="#{page.reset.label.confirmPassword}">确认新口令</label>
                    <div class="iam-input-group">
                        <span class="iam-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/>
                            </svg>
                        </span>
                        <input class="iam-input" type="password" id="confirm-password"
                               autocomplete="new-password" th:placeholder="#{page.reset.placeholder.confirmPassword}" placeholder="再次输入新口令" required>
                    </div>
                </div>

                <button class="iam-btn-primary" type="submit" id="submit-btn"
                        th:text="#{page.reset.submit}">设置新口令</button>
            </form>

            <p class="iam-form-foot">
                <a th:href="@{/login(realm=${realmKey})}" th:text="#{page.common.backToLogin}">返回登录</a>
            </p>

            <div class="iam-lang-row">
                <a th:replace="~{(${themeName} + '/fragments/lang-switch') :: switch}"></a>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    (function () {
        var form = document.getElementById('reset-form');
        var submitBtn = document.getElementById('submit-btn');
        var errorBox = document.getElementById('error-box');
        var successBox = document.getElementById('success-box');
        var realmKey = /*[[${realmKey}]]*/ 'default';

        /* 脚本文案由服务端按请求语言注入 */
        var MSG = {
            tooShort: /*[[#{page.reset.js.tooShort}]]*/ '口令长度需在 8 到 128 个字符之间',
            mismatch: /*[[#{page.reset.js.mismatch}]]*/ '两次输入的口令不一致',
            success: /*[[#{page.reset.js.success}]]*/ '口令已更新,请使用新口令登录。',
            failed: /*[[#{page.reset.js.failed}]]*/ '重置失败,请重新申请',
            networkError: /*[[#{page.common.networkError}]]*/ '网络异常,请稍后重试'
        };

        function showError(text) {
            errorBox.style.display = '';
            document.getElementById('error-text').textContent = text;
        }

        function csrfHeader() {
            var match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : '';
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            errorBox.style.display = 'none';
            var password = document.getElementById('new-password').value;
            var confirm = document.getElementById('confirm-password').value;
            if (password.length < 8) {
                showError(MSG.tooShort);
                return;
            }
            if (password !== confirm) {
                showError(MSG.mismatch);
                return;
            }
            submitBtn.disabled = true;
            fetch('/api/v1/auth/password-reset/confirm?realm=' + encodeURIComponent(realmKey), {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-XSRF-TOKEN': csrfHeader()},
                credentials: 'same-origin',
                body: JSON.stringify({
                    ticket: document.getElementById('ticket').value,
                    newPassword: password
                })
            }).then(function (response) {
                return response.json().catch(function () {
                    return {code: response.status === 200 ? 0 : -1};
                });
            }).then(function (body) {
                submitBtn.disabled = false;
                if (body.code === 0) {
                    form.style.display = 'none';
                    successBox.style.display = '';
                    document.getElementById('success-text').textContent = MSG.success;
                } else {
                    showError(body.message || MSG.failed);
                }
            }).catch(function () {
                submitBtn.disabled = false;
                showError(MSG.networkError);
            });
        });
    })();
</script>
</body>
</html>
