# ============================================================
# Payment 主配置（Nacos）
# 敏感值已使用 jasypt (PBEWITHHMACSHA512ANDAES_256) 加密
# 解密密钥通过环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入
# ============================================================

# Jasypt 配置
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}

server:
  port: ${SERVER_PORT:8082}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # IAM 身份域 issuer，必须带 /realms/{realmKey} 前缀。
          # 显式配置 jwk-set-uri 可避免启动期强依赖 IAM 发现文档。
          issuer-uri: ${IAM_ISSUER_URI:http://localhost:8080/realms/beenest}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        enabled: ${NACOS_ENABLED:true}
        # 指定网卡，避免多网卡环境下注册错误的 IP
        network-interface: ${NETWORK_INTERFACE:}
        # 直接指定注册 IP（优先级最高，解决 IPv6 地址注册问题）
        ip: ${NACOS_DISCOVERY_IP:}
        # 强制使用 IPv4 注册，避免注册 IPv6 地址导致服务间调用失败
        ip-type: IPv4
    inetutils:
      # 优先使用 IPv4 网段（匹配 10.88.x.x 等 WireGuard/内网地址）
      preferred-networks: 10.,172.,192.168.,127.
      # 忽略 macOS 虚拟网卡和 VPN 隧道（wt0 是 WireGuard 业务网卡，不能忽略）
      ignored-interfaces: utun.,awdl.,bridge.,llw.,anpi.,lo0
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
        port: ${SENTINEL_PORT:8720}
      eager: true
    openfeign:
      sentinel:
        enabled: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/beenest?currentSchema=beenest_payment}
    username: ${PAYMENT_DB_USER:postgres}
    password: ENC(6hWkQT9F38bJ3+1F9Wf+hF/ll6Vgz+E9bQgGYvQQxsdqjHOfSz/cBdOTzCXJ3AD8)
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ENC(OcZCGQWaqFnH4Geb90Fsaz7Sp/7CvNhL7x396Q+DAYAmXhctQymT+BDvoou41qwVU0qZnwOHD3ERRN9xnu6iKw==)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ENC(S8SBrfbfI+IOmF1mNDogY0njndh2dTNXqyj8X3W4X1GnANK6frSYe4T8bjycKx/qEbmBYJa7B349UjrhFkK0OQ==)
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: true

# IAM 资源服务认证配置（标准 OAuth2 Resource Server，替代原 CAS 客户端）
iam:
  resource-server:
    enabled: true
    # 访问令牌受众，与 IAM「应用门户 → 令牌受众」保持一致；
    # 未登记受众时 IAM 默认签发 urn:iam:app:{appCode}
    audience: ${IAM_AUDIENCE:urn:iam:app:payment}
    # 钱包 customer_no 取 IAM 令牌中的手机号 phone_number（跨渠道归并锚点），无配置项
    # 是否强制 token_kind=APPLICATION（拒绝平台令牌/机器令牌），客户端绑定应用后建议开启
    require-application-token: ${IAM_REQUIRE_APPLICATION_TOKEN:false}
    # 首次访问自动开通钱包（替代原 CAS 访问控制的“授权即建户”）
    auto-provision-wallet: ${IAM_AUTO_PROVISION_WALLET:true}
    wallet-biz-type: ${IAM_WALLET_BIZ_TYPE:DRONE_ORDER}
    # 钱包非 ACTIVE 时拒绝 C 端访问
    reject-inactive-wallet: true

# 支付配置
payment:
  wallet:
    hash-secret: ENC(JIsDD2wieYBFYbWV636XGk9tgYU4IOMwd+udGr9Vhb9Pgyl4BqkeUfSU9ub+JR+8lVYHkX/xP8Yr2KND0juVjrBNbovf3lMUzl3SB8jG3oD1FYDDk0kyA7Y9w7kS6jbszYSc8/IVeRCrlLmVspi965Jw6VHq9kphIbN85KR6ilBrzaW/1+t9GRo0ffc8BwMf)
  credential:
    cache-refresh-ms: 60000
  callback:
    allowed-ips: ${CALLBACK_ALLOWED_IPS:}
    trust-proxy: ${PAYMENT_CALLBACK_TRUST_PROXY:false}
  wechat:
    enabled: ${WECHAT_ENABLED:true}
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ENC(C+Pp9c6JZYVWL4eBYsQM/N2LBNGzCvf3cQuqF8LWOm6Cf0JErw0zg3bETd4mu1odVA50F6Sp9/sVs01+iV8iDW8lS5XfIAKVWRve/5Co3wo=)
    serial-no: ${WECHAT_SERIAL_NO:}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:classpath:cert/apiclient_key.pem}
    public-key-path: ${WECHAT_PUBLIC_KEY_PATH:classpath:cert/pub_key.pem}
    public-key-id: ${WECHAT_PUBLIC_KEY_ID:}
    notify-url: ${WECHAT_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_REFUND_NOTIFY_URL:}
  alipay:
    enabled: ${ALIPAY_ENABLED:true}
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: https://openapi.alipay.com/gateway.do
    sign-type: RSA2
    charset: UTF-8
    format: json
    notify-url: ${ALIPAY_NOTIFY_URL:}
  douyin:
    enabled: ${DOUYIN_ENABLED:true}
    app-id: ${DOUYIN_APP_ID:}
    app-secret: ${DOUYIN_APP_SECRET:}
    mch-id: ${DOUYIN_MCH_ID:}
    payment-key: ${DOUYIN_PAYMENT_KEY:}
    notify-url: ${DOUYIN_NOTIFY_URL:}
  payscore:
    wechat:
      enabled: ${PAYSCORE_WECHAT_ENABLED:false}
      service-id: ${PAYSCORE_WECHAT_SERVICE_ID:}
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      notify-url: ${PAYSCORE_WECHAT_NOTIFY_URL:}
      complete-notify-url: ${PAYSCORE_WECHAT_COMPLETE_NOTIFY_URL:}
    alipay:
      enabled: ${PAYSCORE_ALIPAY_ENABLED:false}
      product-code: ${PAYSCORE_ALIPAY_PRODUCT_CODE:}
      app-id: ${ALIPAY_APP_ID:}
      notify-url: ${PAYSCORE_ALIPAY_NOTIFY_URL:}
    common:
      auth-expire-minutes: 30
      deposit-default-amount: 100000
      min-credit-score: 600
  common:
    order-expire-minutes: 30
    payment-timeout-seconds: 300
    callback-retry-times: 3
    sandbox: false
    refund-sync-enabled: true
    refund-sync-delay-ms: 30000
    refund-sync-initial-delay-ms: 15000
    refund-sync-batch-size: 20

# 提现配置
withdraw:
  wechat:
    enabled: ${WITHDRAW_WECHAT_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ENC(C+Pp9c6JZYVWL4eBYsQM/N2LBNGzCvf3cQuqF8LWOm6Cf0JErw0zg3bETd4mu1odVA50F6Sp9/sVs01+iV8iDW8lS5XfIAKVWRve/5Co3wo=)
    serial-no: ${WECHAT_SERIAL_NO:}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:classpath:cert/apiclient_key.pem}
    fee-amount: 200
    min-amount: 10000
    max-amount: 5000000
    transfer-scene-id: "1000"
    daily-total-limit: 10000000
    daily-user-limit: 2000000
    daily-count-limit: 3
    hourly-count-limit: 1
  alipay:
    enabled: ${WITHDRAW_ALIPAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    fee-amount: 200
    min-amount: 10000
    max-amount: 5000000
    daily-total-limit: 10000000
    daily-user-limit: 2000000
  douyin:
    enabled: ${WITHDRAW_DOUYIN_ENABLED:false}
    app-id: ${DOUYIN_APP_ID:}
    app-secret: ${DOUYIN_APP_SECRET:}
    merchant-id: ${DOUYIN_MCH_ID:}
