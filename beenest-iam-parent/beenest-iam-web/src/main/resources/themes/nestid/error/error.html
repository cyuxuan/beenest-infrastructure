<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="#{page.error.docTitle}">错误 · 蜂巢身份</title>
    <!-- 设计令牌先于页面样式:主题包改令牌即可换肤,三端共用 -->
    <link rel="stylesheet" th:href="@{/theme-static/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/theme-static/css/iam.css}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12.5 7.2v14.6L16 30 3.5 23.8V9.2z' fill='%23f5b32d'/%3E%3Cpath d='M16 8l6.8 3.9v7.8L16 23.6 9.2 19.7v-7.8z' fill='%230e1626'/%3E%3C/svg%3E">
</head>
<body>
<div class="iam-error-shell" th:classappend="'is-' + ${status}">
    <span class="iam-error-watermark" aria-hidden="true" th:text="${status}">403</span>

    <main class="iam-error-card">
        <svg class="iam-error-emblem" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
                <linearGradient id="err-gold" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#ffd777"/>
                    <stop offset="1" stop-color="#e09a12"/>
                </linearGradient>
            </defs>
            <path d="M16 1.6l12.3 7.1v14.6L16 30.4 3.7 23.3V8.7z"
                  fill="none" stroke="url(#err-gold)" stroke-width="1.3"/>
            <path d="M16 7.4l7 4v8.2l-7 4-7-4v-8.2z" fill="url(#err-gold)" opacity="0.92"/>
            <circle cx="16" cy="15" r="2.1" fill="#0e1626"/>
            <rect x="15.2" y="16.2" width="1.6" height="4.4" rx="0.8" fill="#0e1626"/>
        </svg>

        <div class="iam-error-badge">
            <span class="iam-error-badge-dot" aria-hidden="true"></span>
            <span th:text="${kicker}">ACCESS DENIED</span>
        </div>

        <h1 class="iam-error-title" th:text="${heading}">当前账号无访问权限</h1>
        <p class="iam-error-message" th:text="${message}">你已登录,但当前账号没有访问该应用的权限。</p>

        <div class="iam-error-hint">
            <span class="iam-error-hint-mark" aria-hidden="true">i</span>
            <div class="iam-error-hint-body">
                <p class="iam-error-hint-title" th:text="${hintTitle}">需要访问这个应用?</p>
                <p class="iam-error-hint-text" th:text="${hint}">请联系管理员为你的账号开通访问权限。</p>
            </div>
        </div>

        <div class="iam-error-actions">
            <a th:if="${status == 401}" class="iam-btn-primary" th:href="@{/login}"
               th:text="#{page.error.signIn}">重新登录</a>
            <a th:unless="${status == 401}" class="iam-btn-primary" th:href="@{/portal}"
               th:text="#{page.error.toPortal}">返回应用门户</a>
            <a th:if="${status == 401}" class="iam-btn-ghost" th:href="@{/portal}"
               th:text="#{page.error.toPortal}">返回应用门户</a>
            <a th:unless="${status == 401}" class="iam-btn-ghost" th:href="@{/login}"
               th:text="#{page.error.signIn}">重新登录</a>
        </div>

        <footer class="iam-error-foot">
            <span th:text="#{page.brand.footer}">统一身份认证中心 · beenest IAM</span>
            <a th:replace="~{(${themeName} + '/fragments/lang-switch') :: switch}"></a>
        </footer>
    </main>
</div>
</body>
</html>
