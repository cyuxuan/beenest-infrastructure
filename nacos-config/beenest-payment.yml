# 日志
logging:
  level:
    club.beenest.payment: INFO
    club.beenest.payment.mapper: DEBUG

# Swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
