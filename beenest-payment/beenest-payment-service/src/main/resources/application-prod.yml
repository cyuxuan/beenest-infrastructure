# ============================================================
# Payment 生产环境配置
# 仅覆盖生产环境差异化项（基础设施地址、环境开关）。
# 敏感值全部通过环境变量注入，不提供默认值。
# 业务配置 → application-secret.yml
# 框架配置 → application.yml
# ============================================================

spring:
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          # IAM 身份域 issuer，必须带 /realms/{realmKey} 前缀，由部署环境变量注入。
          # 这里显式留空默认值：缺失时由 PaymentSecurityConfig 抛出可读的
          # "IAM 资源服务未配置端点" 提示，而不是占位符解析失败的晦涩异常；
          # 不给真实默认值，避免生产静默连到测试/本地 IAM。
          issuer-uri: ${IAM_ISSUER_URI:}

payment:
  common:
    sandbox: false
  callback:
    trust-proxy: ${PAYMENT_CALLBACK_TRUST_PROXY:true}

logging:
  level:
    club.beenest.payment: INFO
    club.beenest.payment.mapper: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
